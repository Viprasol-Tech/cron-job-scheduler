[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cron-job-scheduler"
version = "0.1.0"
description = "Cron job scheduler — parse cron expressions and compute next run times — by Viprasol Tech."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
  "cron",
  "scheduler",
  "cron-parser",
  "cronjob",
  "python",
  "scheduling",
  "utility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = ["pydantic>=2.6", "typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
cron-job-scheduler = "cron_job_scheduler.cli:app"

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/cron-job-scheduler"
Issues = "https://github.com/Viprasol-Tech/cron-job-scheduler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cron_job_scheduler"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["B008", "B027", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
